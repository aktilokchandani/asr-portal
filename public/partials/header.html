<!--
  SITE HEADER — edit this ONE file to change the header on every public page.
  It is loaded automatically into any page that has:
    <div id="site-header"></div>
    <script src="/js/include.js"></script>
  Do NOT delete the data-nav attributes on the links below — /js/include.js
  uses them to highlight the current page in the nav.
-->
<header class="site-header">
  <div class="wrap">
    <a href="/" class="brand">
      <img src="/images/logo-removebg-preview-300x166.webp" alt="Active Staffing Resources" class="brand-logo" onerror="this.style.display='none';this.nextElementSibling.style.display='inline'" />
      <span style="display:none">Active Staffing Resources</span>
    </a>
    <nav class="site-nav">
      <a href="/" data-nav="/">Home</a>
      <a href="/about" data-nav="/about">About</a>
      <a href="/services" data-nav="/services">Services</a>
      <a href="/employers" data-nav="/employers">Employers</a>
      <a href="/job-seekers" data-nav="/job-seekers">Job Seekers</a>
      <a href="/blogs" data-nav="/blogs">Blogs</a>
      <a href="/contact" data-nav="/contact">Contact Us</a>
    </nav>
    <div class="header-actions">
      <a href="/login" class="btn btn-ghost">Log In</a>
      <a href="/register" class="btn btn-fill">Get Started</a>
    </div>
  </div>
</header>
