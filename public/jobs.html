<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Open Roles | Active Staffing Resources</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<div id="site-header"></div>

<div class="page-header">
  <h1>Open roles through ASR</h1>
  <p>Client identity stays confidential until you're moving forward in the process — that's part of how we protect both sides. Register or log in to apply.</p>
</div>

<section class="section" style="max-width:820px">
  <div id="statusNote"></div>
  <div id="jobList"></div>
</section>

<div id="site-footer"></div>

<script src="/js/api.js"></script>
<script>
let ME = null;
let MY_APPLICATIONS = [];

window.applyToJob = async function applyToJob(jobId) {
  if (!ME) { window.location.href = '/login?next=jobs'; return; }
  if (ME.role !== 'candidate') {
    alert('Only candidate accounts can apply to roles. You are logged in as a ' + ME.role + ' account.');
    return;
  }
  try {
    await api('/api/applications', { method: 'POST', body: { jobRequestId: jobId } });
    await load();
  } catch (err) {
    alert(err.message);
  }
}

function alreadyApplied(jobId) {
  return MY_APPLICATIONS.some(a => a.jobRequestId === jobId);
}

async function load() {
  const jobs = await api('/api/public/jobs');
  if (ME && ME.role === 'candidate') {
    try { MY_APPLICATIONS = await api('/api/applications'); } catch (e) { MY_APPLICATIONS = []; }
  }
  document.getElementById('jobList').innerHTML = jobs.map(j => `
    <div class="job-card">
      <div class="job-top">
        <div>
          <h3><a href="/job/${j.id}" style="color:inherit;text-decoration:none">${j.title}</a></h3>
          <div class="meta">${j.client} &middot; ${j.location} &middot; ${j.employmentType}</div>
        </div>
        <div class="pay">$${j.payPerDay.toLocaleString('en-US')}/day</div>
      </div>
      <p class="desc">${j.description}</p>
      <div>${j.skillsNeeded.map(s => `<span class="chip">${s}</span>`).join('')}</div>
      <div class="job-bottom">
        <span style="font-size:0.78rem;color:var(--muted)">Posted ${j.createdAt}</span>
        <span style="display:flex;gap:0.5rem">
          <a class="btn-sm secondary" href="/job/${j.id}">View Details</a>
          ${alreadyApplied(j.id)
            ? `<span class="badge active">Applied</span>`
            : `<button class="btn-sm" onclick="applyToJob(${j.id})">Apply Now</button>`}
        </span>
      </div>
    </div>
  `).join('') || `<p class="empty">No open roles right now — check back soon, or create a profile so we can reach out when one opens up.</p>`;
}

(async () => {
  const { user } = await api('/api/me');
  ME = user;
  const noteEl = document.getElementById('statusNote');
  if (!ME) {
    noteEl.innerHTML = `<div class="status-note info">Browsing as a guest. <a href="/register">Create a profile</a> or <a href="/login?next=jobs">log in</a> to apply.</div>`;
  } else if (ME.role === 'candidate') {
    noteEl.innerHTML = `<div class="status-note success">Logged in as ${ME.name}. You can apply directly below.</div>`;
  } else {
    noteEl.innerHTML = `<div class="status-note info">You're logged in as a ${ME.role} account. Applications are only available to candidate accounts.</div>`;
  }
  await load();
})();
</script>

<script src="/js/include.js"></script>
<script src="/js/router.js"></script>
</body>
</html>
